<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #333; }
    .updated { text-align: center; color: #888; font-size: 14px; margin-bottom: 30px; }
    .section { background: white; border-radius: 10px; padding: 20px; margin-bottom: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .kpi-grid { display: flex; flex-wrap: wrap; gap: 15px; }
    .kpi-card { background: #4f46e5; color: white; border-radius: 8px; padding: 20px; flex: 1; min-width: 150px; text-align: center; }
    .kpi-card .label { font-size: 13px; opacity: 0.85; }
    .kpi-card .value { font-size: 32px; font-weight: bold; margin-top: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th { background: #4f46e5; color: white; padding: 10px; text-align: left; }
    td { padding: 8px 10px; border-bottom: 1px solid #eee; }
    tr:hover { background: #f9f9f9; }
  </style>
</head>
<body>
  <h1>📊 Daily Finance Dashboard</h1>
  <div class="updated" id="lastUpdated">Loading...</div>

  <div class="section">
    <h2>Report 1 — KPIs</h2>
    <div class="kpi-grid" id="kpis1"></div>
  </div>

  <div class="section">
    <h2>Report 2 — KPIs</h2>
    <div class="kpi-grid" id="kpis2"></div>
  </div>

  <div class="section">
    <h2>Monthly Overview — Chart</h2>
    <canvas id="monthlyChart" height="100"></canvas>
  </div>

  <div class="section">
    <h2>Monthly Overview — Table</h2>
    <div id="monthlyTable"></div>
  </div>

  <script>
    async function loadData() {
      const res = await fetch('data.json?nocache=' + Date.now());
      const d = await res.json();

      document.getElementById('lastUpdated').textContent = 'Last updated: ' + d.updated;

      // KPI Cards - Report 1
      const k1 = document.getElementById('kpis1');
      d.report1.forEach(item => {
        k1.innerHTML += `<div class="kpi-card"><div class="label">${item.label}</div><div class="value">${item.value}</div></div>`;
      });

      // KPI Cards - Report 2
      const k2 = document.getElementById('kpis2');
      d.report2.forEach(item => {
        k2.innerHTML += `<div class="kpi-card"><div class="label">${item.label}</div><div class="value">${item.value}</div></div>`;
      });

      // Monthly Chart
      const labels = d.monthly.map(r => r[0]);
      const values = d.monthly.map(r => r[1]);
      new Chart(document.getElementById('monthlyChart'), {
        type: 'bar',
        data: { labels, datasets: [{ label: 'Monthly Data', data: values, backgroundColor: '#4f46e5' }] }
      });

      // Monthly Table
      let html = '<table><thead><tr>';
      d.monthlyHeaders.forEach(h => html += `<th>${h}</th>`);
      html += '</tr></thead><tbody>';
      d.monthly.forEach(row => {
        html += '<tr>' + row.map(cell => `<td>${cell}</td>`).join('') + '</tr>';
      });
      html += '</tbody></table>';
      document.getElementById('monthlyTable').innerHTML = html;
    }
    loadData();
  </script>
</body>
</html>
